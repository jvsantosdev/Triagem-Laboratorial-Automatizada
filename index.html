<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador de Laudos Biomédicos</title>
    <link rel="stylesheet" href="./Styles/style.css">
</head>
<body>

    <div class="container-app">
    <h2>Analisador de Exames</h2>
    <p>Triagem Laboratorial Automatizada</p> 
        
        <div class="form-group">
            <label>Nome do Paciente:</label>
            <input type="text" id="nome-paciente">
        </div>

        <div class="form-group">
            <label>Sexo Biológico:</label>
            <select id="sexo-paciente">
                <option value="M">Masculino</option>
                <option value="F">Feminino</option>
            </select>
        </div>

        <div class="form-group">
            <label>Glicose de Jejum (mg/dL):</label>
            <input type="number" id="valor-glicose">
        </div>

        <div class="form-group">
            <label>Hemoglobina (g/dL):</label>
            <input type="number" id="valor-hemoglobina" step="0.1">
        </div>

        <div class="form-group">
            <label>Leucócitos (/mm³):</label>
            <input type="number" id="valor-leucocitos">
        </div>

        <button id="btn-analisar">Analisar Amostra</button>

        <hr>
        
        <h3>Laudo Técnico Preliminar:</h3>
        <div id="resultado-laudo"></div> 

    </div>
    <script src="./Scripts/script.js"></script>
</body>
</html>
