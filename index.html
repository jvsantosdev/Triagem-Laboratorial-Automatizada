<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Triagem laboratorial automatizada: 36 exames, cálculos clínicos e fila de prioridade por valor crítico. Projeto educacional.">
    <title>Triagem Laboratorial Automatizada</title>
</head>
<body>
    <main class="layout">
        <section class="container-app">
            <h2>Analisador de Exames</h2>
            <p>Triagem Laboratorial Automatizada</p>

            <form id="form-triagem" novalidate>
                <div class="grade paciente">
                    <label class="campo largo">
                        <span>Nome do paciente</span>
                        <input type="text" name="nome" autocomplete="off" placeholder="Use dados fictícios">
                    </label>
                    <label class="campo">
                        <span>Sexo biológico</span>
                        <select name="sexo">
                            <option value="M">Masculino</option>
                            <option value="F">Feminino</option>
                        </select>
                    </label>
                    <label class="campo">
                        <span>Idade (anos)</span>
                        <input type="number" name="idade" min="0" max="120" step="1" value="30" required>
                    </label>
                </div>

                <p class="dica">Preencha só os exames que tiver. Os índices (VCM, HCM, CHCM), o LDL, o não-HDL e a TFG são calculados automaticamente.</p>
                <div id="campos-exames"></div>

                <p id="erro" class="erro" role="alert"></p>
                <div class="acoes">
                    <button type="button" id="limpar-form" class="secundario">Limpar</button>
                    <button type="submit">Analisar amostra</button>
                </div>
            </form>

            <hr>
            <h3>Laudo técnico preliminar</h3>
            <div id="resultado-laudo"></div>
        </section>

        <aside class="container-app fila-container">
            <h3>Fila de prioridade</h3>
            <p class="dica">Valores críticos sobem para o topo.</p>
            <div id="fila"></div>
        </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
